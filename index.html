<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Web</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Pantalla de Inicio -->
     <section id="start-screen" class="screen active">
        <p class="start-head"><strong> Ruta. Fundametos del desarrollo Web</strong></p>
        <h1>Dev Quizt</h1>
        <p>Pon a prueba tus conocimientos sobre Internet, Terminal, HTML, CSS, JavaScript y Git.</p>
        <div class="start-contend">
            <p class="start-contend-info">❓ 12 preguntas</p>
            <p class="start-contend-info">🕐 retroalimentación en tiempo real</p>
            <p class="start-contend-info">🏆 Resultado final</p>
        </div>
        <button id="start-btn" class="btn-start"><strong> Comenzar</strong></button>
     </section>

     <!-- Pantalla de Preguntas -->
      <section id="quiz_screen" class="screen">
        <div class="top-bar">
            <span id="progress-text"></span>
            <span id="score">Puntaje: 0</span>
        </div>

        <div class="progress-bar">
            <div id="progress-fill"></div>
        </div>

        <p id="categori" class="quiz-categoria"></p>

        <h2 id="question" class="quiz-title"></h2>

        <div id="options" class="quiz-opcion"></div>

        <p id="explanation" class="quiz-explanation"></p>

        <button id="next-bnt" class="hidden">Siguiente</button>
      </section>

      <!-- Resultado -->
       <section id="result-screen" class="screen">
        <h2>Resultado Final</h2>
        <p id="final-score"></p>
        <p id="final-message"></p>
        <button id="restart-btn">Reiniciar</button>
       </section>
    
       <script src="app.js"></script>
</body>
</html>
